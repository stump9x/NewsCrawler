services:
  db:
    image: postgres:16-alpine
    container_name: nc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: nc-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 15
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  ollama:
    image: ollama/ollama:latest
    container_name: nc-ollama
    restart: unless-stopped
    # Cap VRAM/RAM — unload idle models quickly on shared 8GB host
    mem_limit: ${OLLAMA_MEM_LIMIT:-2048m}
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  searxng:
    image: searxng/searxng:latest
    container_name: nc-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-newscrawler-searx-change-me}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    # Internal only — backend/celery reach it via SEARXNG_URL=http://searxng:8080
    expose:
      - "8080"

  # Selective fetch/search sidecar (Jina → Wigolo → Searx). No eager Chromium warmup.
  wigolo:
    image: ghcr.io/knockoutez/wigolo:latest
    container_name: nc-wigolo
    restart: unless-stopped
    mem_limit: ${WIGOLO_MEM_LIMIT:-768m}
    memswap_limit: ${WIGOLO_MEM_LIMIT:-768m}
    command: ["serve", "--host", "0.0.0.0", "--port", "3333"]
    environment:
      WIGOLO_DATA_DIR: /data
      WIGOLO_API_TOKEN: ${WIGOLO_API_TOKEN:-}
      WIGOLO_SERVE_ALLOW_UNAUTHENTICATED: ${WIGOLO_SERVE_ALLOW_UNAUTHENTICATED:-1}
      WIGOLO_LLM_PROVIDER: ${WIGOLO_LLM_PROVIDER:-groq}
      # Briefing pool only — do not share translate RPM budget
      GROQ_API_KEY: ${GROQ_API_KEY_BRIEFING:-}
      GROQ_API_KEYS: ${GROQ_API_KEYS_BRIEFING:-}
      WIGOLO_LLM_MODEL: ${WIGOLO_LLM_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WIGOLO_SEARCH: ${WIGOLO_SEARCH:-hybrid}
      SEARXNG_URL: ${WIGOLO_SEARXNG_URL:-http://searxng:8080}
      WIGOLO_TLS_TIER: ${WIGOLO_TLS_TIER:-auto}
      WIGOLO_EAGER_WARMUP: ${WIGOLO_EAGER_WARMUP:-0}
      WIGOLO_STEALTH: ${WIGOLO_STEALTH:-auto}
      NODE_OPTIONS: ${WIGOLO_NODE_OPTIONS:---max-old-space-size=512}
    volumes:
      - wigolo_data:/data
    expose:
      - "3333"
    depends_on:
      - searxng
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 90s

  backend:
    image: newscrawler-backend:latest
    build: ./backend
    container_name: nc-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      WIGOLO_URL: ${WIGOLO_URL:-http://wigolo:3333}
      NOTEBOOK_INTERNAL_URL: ${NOTEBOOK_INTERNAL_URL:-http://notebook-gateway:80}
      # Prefer same-port subdomain, e.g. http://notebook.IP.sslip.io:3000
      NOTEBOOK_PUBLIC_URL: ${NOTEBOOK_PUBLIC_URL:-http://127.0.0.1:3000}
      NOTEBOOK_CEREBRAS_PROXY_HEALTH_URL: ${NOTEBOOK_CEREBRAS_PROXY_HEALTH_URL:-http://cerebras-proxy:8088/health}
      NOTEBOOK_MODEL_HEALTH_CACHE_TTL: ${NOTEBOOK_MODEL_HEALTH_CACHE_TTL:-45}
      NOTEBOOK_MODEL_UNHEALTHY_TTL: ${NOTEBOOK_MODEL_UNHEALTHY_TTL:-60}
      GROQ_API_KEYS_TRANSLATE: ${GROQ_API_KEYS_TRANSLATE:-}
      GROQ_API_KEYS_BRIEFING: ${GROQ_API_KEYS_BRIEFING:-}
      NOTEBOOK_GROQ_API_KEYS: ${NOTEBOOK_GROQ_API_KEYS:-}
      NOTEBOOK_SHOPAIKEY_ENABLED: ${NOTEBOOK_SHOPAIKEY_ENABLED:-true}
      NOTEBOOK_SHOPAIKEY_API_KEY: ${NOTEBOOK_SHOPAIKEY_API_KEY:-}
      NOTEBOOK_SHOPAIKEY_BASE_URL: ${NOTEBOOK_SHOPAIKEY_BASE_URL:-https://api.shopaikey.com/v1}
      NOTEBOOK_SHOPAIKEY_MODEL_FAST: ${NOTEBOOK_SHOPAIKEY_MODEL_FAST:-qwen-flash}
      NOTEBOOK_SHOPAIKEY_MODEL_FAST_FALLBACK: ${NOTEBOOK_SHOPAIKEY_MODEL_FAST_FALLBACK:-qwen-plus-latest}
      NOTEBOOK_SHOPAIKEY_MODEL_DEEP: ${NOTEBOOK_SHOPAIKEY_MODEL_DEEP:-qwen3-next-80b-a3b-instruct}
      NOTEBOOK_SHOPAIKEY_MODEL_FALLBACK: ${NOTEBOOK_SHOPAIKEY_MODEL_FALLBACK:-gpt-5-mini}
      NOTEBOOK_SHOPAIKEY_TIMEOUT_SECONDS: ${NOTEBOOK_SHOPAIKEY_TIMEOUT_SECONDS:-9}
      OPENROUTER_ENABLED: ${OPENROUTER_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_KEYS: ${OPENROUTER_API_KEYS:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      OPENROUTER_POOL_NAMESPACE: ${OPENROUTER_POOL_NAMESPACE:-newscrawler}
      CEREBRAS_ENABLED: ${CEREBRAS_ENABLED:-false}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_API_KEYS: ${CEREBRAS_API_KEYS:-}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
      CEREBRAS_FALLBACK_MODELS: ${CEREBRAS_FALLBACK_MODELS:-gemma-4-31b,zai-glm-4.7}
      CEREBRAS_POOL_NAMESPACE: ${CEREBRAS_POOL_NAMESPACE:-newscrawler}
      CEREBRAS_BRIEFING_FALLBACK: ${CEREBRAS_BRIEFING_FALLBACK:-true}
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 35s
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py ensure_superuser &&
             python manage.py seed_rss_sources --deactivate-missing --force-activate &&
             python manage.py seed_document_scan_keywords &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers ${GUNICORN_WORKERS:-1} --timeout 120"

  celery:
    image: newscrawler-backend:latest
    container_name: nc-celery
    restart: unless-stopped
    mem_limit: ${CELERY_MEM_LIMIT:-768m}
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      WIGOLO_URL: ${WIGOLO_URL:-http://wigolo:3333}
      GROQ_API_KEYS_TRANSLATE: ${GROQ_API_KEYS_TRANSLATE:-}
      GROQ_API_KEYS_BRIEFING: ${GROQ_API_KEYS_BRIEFING:-}
      NOTEBOOK_GROQ_API_KEYS: ${NOTEBOOK_GROQ_API_KEYS:-}
      OPENROUTER_ENABLED: ${OPENROUTER_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_KEYS: ${OPENROUTER_API_KEYS:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      OPENROUTER_POOL_NAMESPACE: ${OPENROUTER_POOL_NAMESPACE:-newscrawler}
      CEREBRAS_ENABLED: ${CEREBRAS_ENABLED:-false}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_API_KEYS: ${CEREBRAS_API_KEYS:-}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
      CEREBRAS_FALLBACK_MODELS: ${CEREBRAS_FALLBACK_MODELS:-gemma-4-31b,zai-glm-4.7}
      CEREBRAS_POOL_NAMESPACE: ${CEREBRAS_POOL_NAMESPACE:-newscrawler}
      CEREBRAS_BRIEFING_FALLBACK: ${CEREBRAS_BRIEFING_FALLBACK:-true}
    volumes:
      - ./backend:/app
      - google_browser_profile:/data/google-browser-profile
    depends_on:
      backend:
        condition: service_healthy
      ollama:
        condition: service_started
    shm_size: "256mb"
    command: celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-1} --max-memory-per-child=350000

  celery-beat:
    image: newscrawler-backend:latest
    container_name: nc-celery-beat
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      GROQ_API_KEYS_TRANSLATE: ${GROQ_API_KEYS_TRANSLATE:-}
      GROQ_API_KEYS_BRIEFING: ${GROQ_API_KEYS_BRIEFING:-}
      NOTEBOOK_GROQ_API_KEYS: ${NOTEBOOK_GROQ_API_KEYS:-}
      OPENROUTER_ENABLED: ${OPENROUTER_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_KEYS: ${OPENROUTER_API_KEYS:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      OPENROUTER_POOL_NAMESPACE: ${OPENROUTER_POOL_NAMESPACE:-newscrawler}
      CEREBRAS_ENABLED: ${CEREBRAS_ENABLED:-false}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_API_KEYS: ${CEREBRAS_API_KEYS:-}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
      CEREBRAS_FALLBACK_MODELS: ${CEREBRAS_FALLBACK_MODELS:-gemma-4-31b,zai-glm-4.7}
      CEREBRAS_POOL_NAMESPACE: ${CEREBRAS_POOL_NAMESPACE:-newscrawler}
      CEREBRAS_BRIEFING_FALLBACK: ${CEREBRAS_BRIEFING_FALLBACK:-true}
    volumes:
      - ./backend:/app
    depends_on:
      celery:
        condition: service_started
    command: celery -A config beat -l info

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_NOTEBOOK_URL: ${VITE_NOTEBOOK_URL:-}
        VITE_NOTEBOOK_CHAT_V2: ${NOTEBOOK_CHAT_V2_ENABLED:-false}
        VITE_NOTEBOOK_CHAT_HEDGE_DELAY_MS: ${NOTEBOOK_CHAT_HEDGE_DELAY_MS:-1400}
        VITE_NOTEBOOK_CHAT_CLOUD_TIMEOUT_MS: ${NOTEBOOK_CHAT_CLOUD_TIMEOUT_MS:-8000}
        VITE_NOTEBOOK_CHAT_LOCAL_TIMEOUT_MS: ${NOTEBOOK_CHAT_LOCAL_TIMEOUT_MS:-45000}
    container_name: nc-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Notebook AI — vendored Open Notebook (https://github.com/lfnovo/open-notebook)
  # Speech/podcast (TTS/STT) disabled via gateway + OPEN_NOTEBOOK_DISABLE_SPEECH.
  # SurrealDB stays internal (no host :8000 — conflicts with NewsCrawler backend).
  # ---------------------------------------------------------------------------
  notebook-db:
    image: surrealdb/surrealdb:v2
    container_name: nc-notebook-db
    restart: unless-stopped
    user: root
    command:
      [
        "start",
        "--log",
        "info",
        "--user",
        "${SURREAL_USER:-root}",
        "--pass",
        "${SURREAL_PASSWORD:-root}",
        "rocksdb:/mydata/mydatabase.db",
      ]
    environment:
      SURREAL_EXPERIMENTAL_GRAPHQL: "true"
    volumes:
      - ./data/surreal_notebook:/mydata
    expose:
      - "8000"

  # Tiny OpenAI-compatible sidecar: rotates CEREBRAS_API_KEYS for Notebook.
  # Open Notebook only supports one OPENAI_COMPATIBLE_API_KEY — this burns the pool.
  cerebras-proxy:
    image: python:3.12-alpine
    container_name: nc-cerebras-proxy
    restart: unless-stopped
    mem_limit: ${CEREBRAS_PROXY_MEM_LIMIT:-64m}
    environment:
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_API_KEYS: ${CEREBRAS_API_KEYS:-}
      CEREBRAS_BASE_URL: ${CEREBRAS_BASE_URL:-https://api.cerebras.ai/v1}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
      NOTEBOOK_CEREBRAS_CHAT_MODEL: ${NOTEBOOK_CEREBRAS_CHAT_MODEL:-gpt-oss-120b}
      CEREBRAS_KEY_COOLDOWN_SEC: ${CEREBRAS_KEY_COOLDOWN_SEC:-120}
      CEREBRAS_MIN_INTERVAL_SEC: ${CEREBRAS_MIN_INTERVAL_SEC:-0.5}
      CEREBRAS_MAX_KEY_ATTEMPTS: ${CEREBRAS_MAX_KEY_ATTEMPTS:-4}
      CEREBRAS_TIMEOUT_SEC: ${CEREBRAS_TIMEOUT_SEC:-60}
      CEREBRAS_PROXY_PORT: "8088"
    volumes:
      - ./deploy/notebook/cerebras_compat_proxy.py:/app/proxy.py:ro
    command: ["python", "/app/proxy.py"]
    expose:
      - "8088"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  notebook-ai:
    # Published image (fast). Patched source lives in vendor/open-notebook —
    # rebuild with: docker compose -f docker-compose.yml -f deploy/notebook/compose.build.yml build notebook-ai
    image: ${NOTEBOOK_IMAGE:-lfnovo/open_notebook:v1-latest}
    pull_policy: ${NOTEBOOK_PULL_POLICY:-if_not_present}
    container_name: nc-notebook-ai
    restart: unless-stopped
    mem_limit: ${NOTEBOOK_AI_MEM_LIMIT:-1024m}
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:-newscrawler-notebook-change-me}
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:-}
      OPEN_NOTEBOOK_DISABLE_SPEECH: ${OPEN_NOTEBOOK_DISABLE_SPEECH:-1}
      SURREAL_URL: ws://notebook-db:8000/rpc
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASSWORD: ${SURREAL_PASSWORD:-root}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
      # Leave unset so Open Notebook auto-detects from the browser Host header
      # (works for localhost and public IP). Override only behind a custom domain.
      API_URL: ${NOTEBOOK_API_URL:-}
      # Free LLM stack only — do NOT pass empty OPENAI/ANTHROPIC/DASHSCOPE keys
      # (empty string would falsely mark those providers as "available").
      # Primary Notebook Groq key; Open Notebook accepts a single GROQ_API_KEY today.
      # Extra keys live in NOTEBOOK_GROQ_API_KEYS for future multi-key support.
      GROQ_API_KEY: ${NOTEBOOK_GROQ_API_KEY:-${GROQ_API_KEY:-}}
      NOTEBOOK_GROQ_API_KEYS: ${NOTEBOOK_GROQ_API_KEYS:-}
      # OpenRouter free models remain a fallback after ShopAIKey/Groq.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Paid Notebook-only route. Open Notebook supports one OpenAI-compatible
      # endpoint, so ShopAIKey replaces the unhealthy Cerebras 402 chat route.
      OPENAI_COMPATIBLE_BASE_URL: ${NOTEBOOK_SHOPAIKEY_BASE_URL:-https://api.shopaikey.com/v1}
      OPENAI_COMPATIBLE_API_KEY: ${NOTEBOOK_SHOPAIKEY_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL_LLM: ${NOTEBOOK_SHOPAIKEY_BASE_URL:-https://api.shopaikey.com/v1}
      OPENAI_COMPATIBLE_API_KEY_LLM: ${NOTEBOOK_SHOPAIKEY_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_API_KEYS: ${CEREBRAS_API_KEYS:-}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
      OLLAMA_API_BASE: ${NOTEBOOK_OLLAMA_API_BASE:-http://ollama:11434}
    volumes:
      - ./data/notebook:/app/data
      # Local patches: shared transform instructions + shorter max_tokens for summaries
      - ./vendor/open-notebook/open_notebook/graphs/transformation.py:/app/open_notebook/graphs/transformation.py:ro
      - ./vendor/open-notebook/api/models.py:/app/api/models.py:ro
      - ./vendor/open-notebook/api/routers/transformations.py:/app/api/routers/transformations.py:ro
    expose:
      - "8502"
      - "5055"
    depends_on:
      notebook-db:
        condition: service_started
      cerebras-proxy:
        condition: service_started
      ollama:
        condition: service_started

  notebook-gateway:
    image: nginx:alpine
    container_name: nc-notebook-gateway
    restart: unless-stopped
    ports:
      # Bind all interfaces so remote clients (e.g. http://SERVER:3000) can
      # open Notebook on the same host at :8502 (iframe + "Mở cửa sổ mới").
      - "8502:80"
    volumes:
      - ./deploy/notebook/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - notebook-ai

  # One-shot: register free Groq + Qwen(Ollama) + embedding, set defaults.
  # Opt-in only — avoids leaving exited bootstrap containers after normal up/build.
  # Run: docker compose --profile bootstrap run --rm notebook-bootstrap
  notebook-bootstrap:
    image: python:3.12-alpine
    container_name: nc-notebook-bootstrap
    profiles: ["bootstrap"]
    restart: "no"
    depends_on:
      - notebook-gateway
      - ollama
    volumes:
      - ./deploy/notebook/bootstrap_free_llms.sh:/bootstrap.sh:ro
      - ./deploy/notebook/seed_transformations.py:/seed_transformations.py:ro
    environment:
      NOTEBOOK_BOOTSTRAP_URL: http://notebook-gateway:80
      NOTEBOOK_BOOTSTRAP_URL_FALLBACK: http://notebook-ai:8502
      NOTEBOOK_GROQ_CHAT_MODEL: ${NOTEBOOK_GROQ_CHAT_MODEL:-llama-3.1-8b-instant}
      NOTEBOOK_GROQ_CHAT_MODEL_ALT: ${NOTEBOOK_GROQ_CHAT_MODEL_ALT:-llama-3.3-70b-versatile}
      NOTEBOOK_QWEN_CHAT_MODEL: ${NOTEBOOK_QWEN_CHAT_MODEL:-qwen2.5:3b}
      NOTEBOOK_QWEN_CHAT_MODEL_FAST: ${NOTEBOOK_QWEN_CHAT_MODEL_FAST:-qwen2.5:1.5b}
      # Interactive Chat: ShopAIKey primary; Groq/OpenRouter are bounded fallbacks.
      NOTEBOOK_DEFAULT_CHAT_PROVIDER: ${NOTEBOOK_DEFAULT_CHAT_PROVIDER:-shopaikey}
      NOTEBOOK_SHOPAIKEY_API_KEY: ${NOTEBOOK_SHOPAIKEY_API_KEY:-}
      NOTEBOOK_SHOPAIKEY_MODEL_FAST: ${NOTEBOOK_SHOPAIKEY_MODEL_FAST:-qwen-flash}
      NOTEBOOK_SHOPAIKEY_MODEL_DEEP: ${NOTEBOOK_SHOPAIKEY_MODEL_DEEP:-qwen3-next-80b-a3b-instruct}
      NOTEBOOK_SHOPAIKEY_MODEL_FALLBACK: ${NOTEBOOK_SHOPAIKEY_MODEL_FALLBACK:-gpt-5-mini}
      NOTEBOOK_CEREBRAS_CHAT_MODEL: ${NOTEBOOK_CEREBRAS_CHAT_MODEL:-gpt-oss-120b}
      NOTEBOOK_CEREBRAS_FALLBACK_MODELS: ${NOTEBOOK_CEREBRAS_FALLBACK_MODELS:-gemma-4-31b,zai-glm-4.7}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      NOTEBOOK_OPENROUTER_CHAT_MODEL: ${NOTEBOOK_OPENROUTER_CHAT_MODEL:-openrouter/free}
      NOTEBOOK_OPENROUTER_FALLBACK_MODELS: ${NOTEBOOK_OPENROUTER_FALLBACK_MODELS:-meta-llama/llama-3.3-70b-instruct:free,qwen/qwen3-235b-a22b:free,google/gemma-3-27b-it:free,deepseek/deepseek-r1-0528:free}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NOTEBOOK_EMBED_MODEL: ${NOTEBOOK_EMBED_MODEL:-nomic-embed-text}
      NOTEBOOK_BOOTSTRAP_FORCE: ${NOTEBOOK_BOOTSTRAP_FORCE:-0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl >/dev/null
        # Ensure free local embedding model exists (Qwen chat already pulled by NewsCrawler).
        curl -fsS http://ollama:11434/api/tags >/dev/null || true
        curl -fsS http://ollama:11434/api/pull -d '{"name":"nomic-embed-text","stream":false}' >/dev/null 2>&1 || true
        sh /bootstrap.sh

volumes:
  postgres_data:
  ollama_data:
  google_browser_profile:
  wigolo_data:
