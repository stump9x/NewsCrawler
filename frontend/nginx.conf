# NewsCrawler UI (default) + Notebook AI APIs on same :3000.
#   App + Notebook UI:  http://IP:3000/notebook-ai
#   Notebook REST:      http://IP:3000/api/nb/...  → notebook-gateway /api/...
# Optional legacy Host vhost (full Open Notebook Next.js) still on notebook.*

# ---------------------------------------------------------------------------
# Notebook AI — Host: notebook.* (full Open Notebook UI, optional)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name notebook.localhost
                ~^notebook\.[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.sslip\.io$
                ~^notebook\.[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.nip\.io$
                ~^notebook\.;

    client_max_body_size 100M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /config {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"apiUrl":""}';
    }

    location / {
        set $notebook_upstream "notebook-gateway:80";
        proxy_pass http://$notebook_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Accept-Encoding "";

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }
}

# ---------------------------------------------------------------------------
# NewsCrawler SPA + Django API + Notebook API (same-origin /api/nb)
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' http: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Open Notebook REST — MUST be before Django /api/
    location /api/nb/ {
        set $notebook_upstream "notebook-gateway:80";
        rewrite ^/api/nb/(.*)$ /api/$1 break;
        proxy_pass http://$notebook_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_max_body_size 100M;
        proxy_set_header Accept-Encoding "";
    }

    location /api/ {
        set $api_upstream "nc-backend:8000";
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
    }
}
