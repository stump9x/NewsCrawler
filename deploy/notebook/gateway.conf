resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Disable upstream compression so sub_filter can inject no-speech helpers.
    proxy_set_header Accept-Encoding "";

    # Force relative API base so the browser talks to the same origin (:8502).
    # Upstream Open Notebook auto-detect wrongly appends :5055 (not published).
    location = /config {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"apiUrl":""}';
    }

    # Speech / podcast API + pages (410 Gone)
    location ~* ^/(podcasts|api/podcasts|api/episode-profiles|api/speaker-profiles)(/|$) {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 410 '{"detail":"Speech/podcast (TTS/STT) is disabled in NewsCrawler Notebook AI"}';
    }

    # Open Notebook REST API (uvicorn on 5055) — must not hit Next.js :8502
    location /api/ {
        set $notebook_api "notebook-ai:5055";
        proxy_pass http://$notebook_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        set $notebook_upstream "notebook-ai:8502";
        proxy_pass http://$notebook_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Allow iframe from any NewsCrawler origin (localhost or public IP :3000).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors *" always;

        # Best-effort hide of podcast nav when using the published image (unpatched UI).
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<style id="nc-no-speech">a[href="/podcasts"],a[href^="/podcasts/"]{display:none!important}</style><script id="nc-no-speech-js">(function(){function hide(){try{document.querySelectorAll(\'a[href="/podcasts"],a[href^="/podcasts/"]\').forEach(function(a){var n=a.closest(\'div.space-y-1\')||a;n.style.display=\'none\';});}catch(e){}}hide();try{new MutationObserver(hide).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}})();</script></head>';
    }
}
